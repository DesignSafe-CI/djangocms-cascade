language: python

jobs:
  include:
    - python: '3.11'
      env: TOX_ENV=py311-django42-cms311
    - python: '3.11'
      env: TOX_ENV=py311-django42-cms41
    - python: '3.12'
      env: TOX_ENV=py312-django42-cms311
    - python: '3.12'
      env: TOX_ENV=py312-django42-cms41
    - python: '3.12'
      env: TOX_ENV=py312-django52-cms51
    - python: '3.13'
      env: TOX_ENV=py313-django52-cms51

install:
  - pip install tox

script:
  - tox -e "$TOX_ENV"
