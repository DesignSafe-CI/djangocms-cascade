language: python

python:
  - '3.11'
  - '3.12'
  - '3.13'

env:
  matrix:
    - DJANGO=django42 CMS=cms311
    - DJANGO=django42 CMS=cms41
    - DJANGO=django52 CMS=cms51

jobs:
  exclude:
    - python: '3.11'
      env: DJANGO=django52 CMS=cms51
    - python: '3.13'
      env: DJANGO=django42 CMS=cms311
    - python: '3.13'
      env: DJANGO=django42 CMS=cms41

install:
  - pip install 'uv>=0.11.18,<0.12'
  - uv sync --locked

script:
  - PYVER="py${TRAVIS_PYTHON_VERSION/./}"
  - uv run --locked tox -e "$PYVER-$DJANGO-$CMS"
