[build-system]
requires = ["uv_build>=0.11.18,<0.12"]
build-backend = "uv_build"

[project]
name = "djangocms-cascade"
version = "0.16.3"
description = "Collection of extendible plugins for django-CMS to create and edit widgets in a simple manner"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE-MIT"]
authors = [{name = "Jacob Rief", email = "jacob.rief@gmail.com"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "jsonfield",
    "django-classy-tags>=0.8",
    "django-cms>=3.4,!=4.0.*",
    "packaging",
    "six",
    "djangocms-text-ckeditor>=3.4",
]

[project.urls]
Homepage = "https://github.com/jrief/djangocms-cascade"

[dependency-groups]
dev = [
    {include-group = "test"},
    "tox>=4",
    "tox-uv>=1",
]
test = [
    "Django>=5.2,<5.3",
    "django-cms>=5.1,<5.2",
    "Pillow>=9",
    "beautifulsoup4>=4.11",
    "lxml>=4.9",
    "django-admin-sortable2>=2,<3",
    "django-filer>=3,<4",
    "djangocms-text-ckeditor>=5.1,<6",
    "jsonfield>=3,<4",
    "pytest>=7",
    "pytest-django>=4.5",
    "six>=1.10",
    "django-reversion>=5,<7",
]

[tool.uv.build-backend]
module-name = "cmsplugin_cascade"
module-root = ""
source-include = ["tests/**", "tox.ini", "pytest.ini"]
