[tox]
envlist = py{311,312}-django42-cms{311,41}, py{312,313}-django52-cms51

[testenv]
usedevelop = True
commands = python -m pytest tests {posargs}
deps =
    django42,django52: -rtests/requirements.txt
    django19,django110,django111: -rtests/requirements-legacy.txt
    cms34: django-cms==3.4.6
    cms35: django-cms==3.5.1
    cms311: django-cms>=3.11,<3.12
    cms41: django-cms>=4.1,<4.2
    cms51: django-cms>=5.1,<5.2
    django19: Django==1.9.13
    django110: Django==1.10.8
    django111: Django==1.11.12
    django42: Django>=4.2,<4.3
    django52: Django>=5.2,<5.3
